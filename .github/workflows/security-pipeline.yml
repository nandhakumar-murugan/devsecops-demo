name: DevSecOps Automated Security Pipeline - Nandhakumar M (711724UCY129)

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  security_audit:
    name: Multi-Layer Security Scanning Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Execute Secret Scan Detection (Gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: false

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SAST Scanner (Bandit)
        run: |
          python -m pip install --upgrade pip
          pip install bandit

      - name: Execute SAST Analysis
        run: |
          bandit -r . -ll -ii

      - name: Execute SCA Dependency Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '1'
          severity: 'HIGH,CRITICAL'
